    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        var isExtensionError = function(msg, src) {
          var str = (String(msg || '') + ' ' + String(src || '')).toLowerCase();
          return (
            str.indexOf('chrome: call method') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('extension context invalidated') !== -1 ||
            str.indexOf('bekkpoinfafbjglppgdobfdeckghdhlo') !== -1
          );
        };

        window.addEventListener('error', function(event) {
          if (isExtensionError(event.message, event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (isExtensionError(msg, '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, err) {
          if (isExtensionError(msg, url)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
